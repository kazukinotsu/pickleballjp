name: Drop Watch (Target)

# 近くの Target 1店舗について、watchlist.json の DPCI を定期チェックし、
# 発売日が今日/明日になった・店舗在庫が付いた・購入可能になった商品をメール通知する。
#
# 通知は既定で GitHub Issue を立てる方式。GitHub が Issue の通知メールを送るため、
# Secrets の登録は不要（リポジトリの通知設定が有効であればメールが届く）。
#
# 任意の Secrets (Settings > Secrets and variables > Actions):
#   MAIL_TO / MAIL_SERVER / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD
#                      … 指定した場合のみ、Issue に加えて HTML メールも直接送る
#   TARGET_REDSKY_KEY  … Redsky 公開キーが失効したとき差し替える
#   TARGET_STORE_ID    … 監視店舗を固定したいとき

# 以前 403 + CAPTCHA で弾かれていたのは、ブラウザでないのに Origin/Referer を
# 偽装して送っていたため。偽装をやめたらランナーからも通ることを実測で確認したので、
# 定期実行を再開している（Probe Target reachability で再確認できる）。
on:
  schedule:
    # ドロップは開店(8時前後)に反映されるため 6:00-10:00 PT を15分間隔
    # PDT(UTC-7) 換算: 13:00-17:00 UTC
    - cron: "*/15 13-17 * * *"
    # 前夜にも1回。翌日の street date が入った時点で「明日発売」を捕まえる
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "通知テスト: 検知なしでテスト用 Issue を立てて、メールが届くか確かめる"
        type: boolean
        default: false

concurrency:
  group: drop-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      ALERT_TZ: America/Los_Angeles
      TARGET_REDSKY_KEY: ${{ secrets.TARGET_REDSKY_KEY }}
      TARGET_STORE_ID: ${{ secrets.TARGET_STORE_ID }}
      HAS_MAIL: ${{ secrets.MAIL_SERVER != '' && secrets.MAIL_TO != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 通知経路の自己テスト。Issue を「自分で」立てると GitHub は自分宛の通知を
      # 送らないため、本番と同じく github-actions[bot] に立てさせて確かめる。
      - name: Notification self-test
        if: inputs.test_notification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create drop-alert --color FF69B4 \
            --description "Target drop detected" --force || true
          gh issue create \
            --title "🧪 [テスト] Drop Watch 通知テスト（bot発行）" \
            --label drop-alert \
            --assignee "${{ github.repository_owner }}" \
            --body "$(cat <<'BODY'
          これは通知経路の確認用テストです。実際のドロップ検知ではありません。

          この Issue は本番と同じく **github-actions[bot]** が作成し、あなたを assignee に
          設定しています。**このメールが届けば、実際のドロップ時も同じように届きます。**

          確認できたらこの Issue は閉じてかまいません。

          届かない場合の確認箇所:
          1. GitHub > Settings > Notifications > **Email** が有効か
          2. 同ページの **Participating** に Email のチェックが入っているか
          3. GitHub > Settings > Emails に登録されているアドレスはどれか
             (通知はそのアドレスに届きます)
          4. 迷惑メールに notifications@github.com が入っていないか
          BODY
          )"

      - name: Check drops
        id: check
        run: node scripts/check-drops.mjs

      - name: Read email subject
        id: mail
        if: steps.check.outputs.alert == 'true'
        run: |
          echo "subject=$(cat out/subject.txt)" >> "$GITHUB_OUTPUT"

      # 既定の通知経路。Issue を立てると GitHub が通知メールを送るので、
      # SMTP の Secrets を一切登録せずにメールが届く。
      - name: Open drop alert issue
        if: steps.check.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create drop-alert --color FF69B4 \
            --description "Target drop detected" --force || true
          gh issue create \
            --title "$(cat out/subject.txt)" \
            --body-file out/issue.md \
            --label drop-alert \
            --assignee "${{ github.repository_owner }}"

      # 任意。SMTP の Secrets を登録した場合のみ、HTML メールも直接送る。
      - name: Send drop alert
        if: steps.check.outputs.alert == 'true' && env.HAS_MAIL == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.mail.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: Target Drop Watch <${{ secrets.MAIL_USERNAME }}>
          html_body: file://out/email.html

      # 15分ごとに失敗通知を出すと煩いので、前夜の1回だけジョブを失敗させて気付けるようにする
      - name: Fail once a day if the watcher is broken
        if: steps.check.outputs.error == 'true' && github.event.schedule == '0 2 * * *'
        run: |
          echo "::error::Target(Redsky) に到達できません。TARGET_REDSKY_KEY の失効か bot ブロックの可能性。"
          exit 1

      - name: Persist state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Redsky に到達できず state を書けなかった回もあるので、無い場合は何もしない
          if [ ! -f state/drop-state.json ]; then
            echo "state file not written (check step could not reach Target) — skipping"
            exit 0
          fi
          git add state/drop-state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore(drop-watch): update state [skip ci]"
            # 監視が並走しても取りこぼさないよう、押し出されたら取り込んで再試行
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
              sleep 3
            done
          fi
